<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Times Table Rocket</title>
<style>
:root{--bg:#e8f6ff;--card:#fff;--tx:#23304a;--pr:#1f7ae0;--ok:#2e9e5b;--no:#e8903a;--bd:#bcdcf5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14203a;--card:#1f2e50;--tx:#eef4ff;--pr:#4a9bff;--ok:#3cc47a;--no:#f0a24f;--bd:#37507f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14203a;--card:#1f2e50;--tx:#eef4ff;--pr:#4a9bff;--ok:#3cc47a;--no:#f0a24f;--bd:#37507f;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;text-align:center}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:2rem;margin:8px 0}
.card{background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:18px;margin:12px 0}
.bar{display:flex;justify-content:space-between;font-size:1.4rem;font-weight:700}
.rk{height:18px;background:var(--bd);border-radius:9px;margin:10px 0;overflow:hidden}
#fl{height:100%;width:0;background:var(--ok);transition:width .4s}
.q{font-size:3rem;font-weight:700;min-height:90px;display:flex;align-items:center;justify-content:center}
.o{display:grid;gap:12px;margin:12px 0}
.b{width:100%;font:inherit;font-size:2rem;font-weight:700;padding:18px;border:0;border-radius:20px;background:var(--pr);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);margin:0 0 10px}
.b:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.b.ok{background:var(--ok)}.b.no{background:var(--no)}
.o .b{margin:0}
.f{font-size:1.3rem;min-height:70px;font-weight:700}
.big{font-size:3rem;margin:8px 0}
[hidden]{display:none!important}
</style></head><body><main>
<h1>🚀 Times Table Rocket</h1>
<section id="s" class="card">
<div class="big">🚀 ⭐ 🌙</div>
<p style="font-size:1.4rem">Answer 20 questions to launch your rocket! Pick your tables:</p>
<button class="b" data-t="2,4,8">2, 4 and 8</button>
<button class="b" data-t="3,6,9">3, 6 and 9</button>
<button class="b" data-t="2,3,4,6,8,9">All together</button>
</section>
<section id="g" hidden>
<div class="bar"><span id="sc">⭐ 0</span><span id="tm">⏱ 0:00</span><span id="pg">1/20</span></div>
<div class="rk"><div id="fl"></div></div>
<div class="card"><div id="q" class="q"></div></div>
<div id="o" class="o"></div>
<div id="f" class="f"></div>
<button id="n" class="b" hidden>Next ➜</button>
</section>
<section id="e" class="card" hidden>
<div class="big" id="st"></div>
<h2 id="ms"></h2>
<p style="font-size:1.4rem" id="sm"></p>
<button class="b" id="again">Play again 🔄</button>
</section>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))};
var shuf=function(a){return a.map(function(x){return[Math.random(),x]}).sort(function(p,q){return p[0]-q[0]}).map(function(x){return x[1]})};
var pick1=function(a){return a[R(0,a.length-1)]};
var Q=[],i=0,score=0,locked=false,T=[];
function nums(ans){var s=[ans];while(s.length<3){var v=Math.max(1,ans+pick1([-10,-6,-4,-3,-2,-1,1,2,3,4,6,10]));if(s.indexOf(v)<0)s.push(v)}return shuf(s).map(String)}
function hint(t,n){var p=t*n;
 if(t==2)return"Double "+n+" is "+p+".";
 if(t==4)return"Double "+n+" = "+2*n+", double again = "+p+".";
 if(t==8)return"4 × "+n+" = "+4*n+", double it = "+p+".";
 if(t==3)return"Double "+n+" = "+2*n+", then add "+n+" more = "+p+".";
 if(t==6)return"3 × "+n+" = "+3*n+", double it = "+p+".";
 return"3 × "+n+" + 6 × "+n+" = "+3*n+" + "+6*n+" = "+p+"."}
function make(){var t=pick1(T),n=R(2,10),p=t*n,k=R(0,14);
 if(k<6){var x=k%2?t+" × "+n:n+" × "+t;return{t:x+" = ?",o:nums(p),a:String(p),h:hint(t,n)}}
 if(k<8)return{t:t+" × ? = "+p,o:nums(n),a:String(n),h:"Count in "+t+"s until you reach "+p+"."};
 if(k<10){var tf=Math.random()<.5,sh=tf?p:p+pick1([-t,t,1,-1]);return{t:"True or false?  "+t+" × "+n+" = "+sh,o:["True ✅","False ❌"],a:tf?"True ✅":"False ❌",h:t+" × "+n+" = "+p+"."}}
 if(k<12&&t<5){return{t:"If "+t+" × "+n+" = "+p+", then "+2*t+" × "+n+" = ?",o:nums(2*p),a:String(2*p),h:"Double "+p+" = "+2*p+"."}}
 return{t:p+" ÷ "+t+" = ?",o:nums(n),a:String(n),h:"Think: "+t+" × ? = "+p+"."}}
var tI,t0;function tick(){var s=Math.floor((Date.now()-t0)/1000);$("tm").textContent="⏱ "+Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function start(){clearInterval(tI);t0=Date.now();tick();tI=setInterval(tick,1000);Q=[];for(var k=0;k<20;k++)Q.push(make());i=0;score=0;locked=false;$("s").hidden=true;$("e").hidden=true;$("g").hidden=false;$("sc").textContent="⭐ 0";$("fl").style.width="0";show()}
function show(){var c=Q[i];$("pg").textContent=(i+1)+"/20";$("q").textContent=c.t;$("f").textContent="";$("n").hidden=true;$("o").innerHTML="";
 c.o.forEach(function(v){var b=document.createElement("button");b.className="b";b.textContent=v;b.onclick=function(){choose(b,v)};$("o").appendChild(b)})}
function choose(b,v){if(locked)return;locked=true;var c=Q[i];
 if(v===c.a){score++;b.classList.add("ok");$("sc").textContent="⭐ "+score;$("fl").style.width=score*5+"%";$("f").textContent=pick1(["Blast off! 🚀","Brilliant! 🌟","Well done! 🎉","Super! 👏"])}
 else{b.classList.add("no");Array.prototype.forEach.call($("o").children,function(x){if(x.textContent===c.a)x.classList.add("ok")});$("f").textContent="Nice try! 💪 "+c.h+" The answer is "+c.a+"."}
 $("n").textContent=i==19?"See my stars ➜":"Next ➜";$("n").hidden=false}
$("n").onclick=function(){i++;if(i>=20){end()}else{locked=false;show()}};
function end(){clearInterval(tI);$("g").hidden=true;$("e").hidden=false;$("st").textContent=score>=18?"🚀🌙":score>=12?"🚀⭐":"🚀";
 $("ms").textContent=score>=18?"You reached the Moon! 🏆":score>=12?"Great flying! 🎉":"Good try! Keep practising! 💪";
 $("sm").textContent="You scored "+score+" out of 20 in "+$("tm").textContent.slice(2)+"."}
Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(b){b.onclick=function(){T=b.dataset.t.split(",").map(Number);start()}});
$("again").onclick=function(){$("e").hidden=true;$("s").hidden=false};
</script></body></html>
